```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>PROFILE SETUP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    padding:30px;

    font-family:sans-serif;

    color:white;

    background:
    radial-gradient(circle at top,
    #34124a 0%,
    #0d0d16 40%,
    #050507 100%);
}

/* タイトル */

.title{

    text-align:center;

    margin-bottom:30px;
}

.title h1{

    font-size:34px;

    letter-spacing:2px;

    margin-bottom:10px;
}

.title p{

    color:#cfcfe8;

    font-size:14px;
}

/* カード */

.card{

    max-width:700px;

    margin:auto;

    padding:30px;

    border-radius:28px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 30px rgba(139,92,246,0.25);
}

/* 入力 */

.input-group{

    margin-bottom:28px;
}

.input-group label{

    display:block;

    margin-bottom:12px;

    color:#d8b4fe;

    font-size:14px;
}

.input-group input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:15px;
}

.input-group input::placeholder{

    color:#aaa;
}

/* 検索 */

.search-box{

    margin-bottom:25px;
}

.search-box input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:white;
}

/* カテゴリ */

.category{

    margin-bottom:30px;
}

.category-title{

    margin-bottom:14px;

    color:#f0abfc;

    font-size:16px;

    font-weight:bold;
}

/* タグ */

.tags{

    display:flex;

    flex-wrap:wrap;

    gap:12px;
}

.tag{

    position:relative;

    padding:10px 16px;

    border-radius:999px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    cursor:pointer;

    transition:0.2s;

    user-select:none;

    overflow:hidden;
}

.tag:hover{

    transform:translateY(-2px);
}

.tag.active{

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    border:none;

    box-shadow:
    0 0 15px rgba(236,72,153,0.45);
}

/* ♡アニメ */

.heart{

    position:absolute;

    right:8px;
    top:2px;

    font-size:12px;

    opacity:0;

    animation:heartPop 0.5s ease;
}

@keyframes heartPop{

    0%{
        transform:
        translateY(8px)
        scale(0.5);

        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:
        translateY(-8px)
        scale(1.2);

        opacity:0;
    }

}

/* 選択数 */

.selected-count{

    margin-bottom:20px;

    color:#f9a8d4;

    font-size:14px;
}

/* ボタン */

.save-btn{

    width:100%;

    margin-top:20px;

    padding:16px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.25s;
}

.save-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(236,72,153,0.5);
}

/* メッセージ */

.message{

    text-align:center;

    margin-top:20px;

    color:#f9a8d4;

    min-height:20px;
}

</style>
</head>

<body>

    <div

    <!-- 甘やかし -->

    <div class="category">

        </div>

        <div class="tags">

            <div class="tag">甘やかし</div>

    <div class="category">

        <div class="tags">

    <!-- 感覚 -->

<script type="module">

import {
    createClient
}
from 'https://esm.sh/@supabase/supabase-js@2'

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://mkjpfiyfhjmthrrmwgyg.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ranBmaXlmaGptdGhycm13Z3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzA2MjIsImV4cCI6MjA5NDY0NjYyMn0.1EZR4uc0q4l1oMCgqgPqg7g6k5SCFI4zdKudD0wIsyU";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* =========================
   タグ選択
========================= */

const tags =
document.querySelectorAll('.tag');

const selectedCount =
document.getElementById(
'selectedCount'
);

function updateCount(){

    const count =
    document.querySelectorAll(
        '.tag.active'
    ).length;

    selectedCount.innerText =
    count + '個選択中';

}

tags.forEach(tag=>{

    tag.addEventListener(
        'click',
        ()=>{

            tag.classList
            .toggle('active');

            /* ♡ */

            const heart =
            document.createElement(
                'div'
            );

            heart.className =
            'heart';

            heart.innerText =
            '♡';

            tag.appendChild(
                heart
            );

            setTimeout(()=>{

                heart.remove();

            },500);

            updateCount();

        }
    );

});

/* =========================
   検索
========================= */

document
.getElementById('search')
.addEventListener(
'input',
function(){

    const keyword =
    this.value;

    tags.forEach(tag=>{

        if(
            tag.innerText
            .includes(keyword)
        ){

            tag.style.display =
            'inline-block';

        }else{

            tag.style.display =
            'none';

        }

    });

});

/* =========================
   保存
========================= */

window.saveProfile =
async function(){

    const name =
    document
    .getElementById(
        'name'
    )
    .value;

    const selectedTags =
    [];

    document
    .querySelectorAll(
        '.tag.active'
    )
    .forEach(tag=>{

        selectedTags.push(
            tag.innerText
        );

    });

    const {
        data: { user }
    } =
    await supabase
    .auth
    .getUser();

    if(!user){

        alert(
            'ログインしてください'
        );

        return;
    }

    const {
        data,
        error
    } =
    await supabase
    .from('users')
    .update({

        name: name,

        interests:
        selectedTags,

        affection: 0

    })
    .eq(
        'id',
        user.id
    )
    .select();

    console.log(data);
    console.log(error);

    if(error){

        document
        .getElementById(
            'message'
        )
        .innerText =
        '保存失敗';

        return;
    }

    document
    .getElementById(
        'message'
    )
    .innerText =
    '保存しました';

    setTimeout(()=>{

        location.href =
        'chat.html';

    },1000);

}

</script>

</body>

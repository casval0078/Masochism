<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
    overflow-y:auto;

    font-family:sans-serif;

    color:white;

    background:
    radial-gradient(circle at top,
    #34124a 0%,
    #0d0d16 40%,
    #050507 100%);
}

/* 背景の光 */

.glow{

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:#8b5cf6;

    filter:blur(140px);

    opacity:0.25;

    animation:float 6s ease-in-out infinite;
}

.glow2{

    left:60%;
    top:55%;

    background:#ec4899;

    animation-delay:2s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* ログインカード */

.login-box{

    position:relative;

    width:360px;

    padding:40px;

    border-radius:28px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 30px rgba(139,92,246,0.25);

    z-index:2;
}

/* タイトル */

.title{

    text-align:center;

    margin-bottom:30px;
}

.title h1{

    font-size:34px;

    letter-spacing:3px;

    margin-bottom:8px;
}

.title p{

    color:#cfcfe8;

    font-size:14px;
}

/* 入力欄 */

.input-group{

    margin-bottom:18px;
}

.input-group input{

    width:100%;

    padding:14px;

    border:none;
    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:15px;
}

.input-group input::placeholder{

    color:#b8b8d0;
}

/* ボタン */

.main-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.25s;

    margin-top:6px;
}

.main-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(236,72,153,0.5);
}

/* 下テキスト */

.register-link{

    margin-top:22px;

    text-align:center;

    font-size:13px;

    color:#bcbcd4;
}

.register-link span{

    color:#d8b4fe;

    cursor:pointer;
}

/* メッセージ */

.message{

    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:#f9a8d4;

    min-height:20px;
}

/* secret */

.secret{

    margin-top:24px;

    text-align:center;

    font-size:12px;

    color:#888;

    letter-spacing:2px;
}

/* モーダル */

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.65);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:10;

    padding:20px;

    overflow-y:auto;
}

.modal-content{

    width:100%;
    max-width:320px;

    padding:30px;

    border-radius:24px;

    background:#12121d;

    max-height:90vh;

    overflow-y:auto;

    border:1px solid rgba(255,255,255,0.08);
}

.modal-title{

    text-align:center;

    margin-bottom:20px;
}

.close-btn{

    margin-top:14px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#2a2a38;

    color:white;

    cursor:pointer;
}

@media (max-width: 480px){

    .login-box{

        width:92%;

        padding:24px;

    }

    .title h1{

        font-size:28px;

    }

    .modal-content{

        width:100%;

        max-width:none;

        padding:24px;

    }

}    
    
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<!-- ログイン -->

<div class="login-box">

    <div class="title">
        <h1>LOGIN</h1>
        <p>今夜も来てくれたんだ。</p>
    </div>

    <div class="input-group">
        <input
            id="email"
            type="email"
            placeholder="メールアドレス">
    </div>

    <div class="input-group">
        <input
            id="password"
            type="password"
            placeholder="パスワード">
    </div>

    <button
        class="main-btn"
        onclick="login()">

        入室する

    </button>

    <div class="register-link">

        初めて？
        <span onclick="openRegister()">
            新規登録
        </span>

    </div>

    <div
        class="message"
        id="message">
    </div>

    <div class="secret">
        only for you
    </div>

</div>

<!-- 新規登録モーダル -->

<div
    class="modal"
    id="registerModal">

    <div class="modal-content">

        <div class="modal-title">
            <h2>新規登録</h2>
        </div>

        <div class="input-group">
            <input
                id="registerEmail"
                type="email"
                placeholder="メールアドレス">
        </div>

        <div class="input-group">
            <input
                id="registerPassword"
                type="password"
                placeholder="パスワード">
        </div>

        <button
            class="main-btn"
            onclick="signUp()">

            登録する

        </button>

        <button
            class="close-btn"
            onclick="closeRegister()">

            閉じる

        </button>

    </div>

</div>

<script type="module">

import {
    createClient
}
from 'https://esm.sh/@supabase/supabase-js@2'

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
"https://mkjpfiyfhjmthrrmwgyg.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ranBmaXlmaGptdGhycm13Z3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzA2MjIsImV4cCI6MjA5NDY0NjYyMn0.1EZR4uc0q4l1oMCgqgPqg7g6k5SCFI4zdKudD0wIsyU";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* =========================
   メッセージ
========================= */

function showMessage(text){

    document.getElementById("message")
    .innerText = text;

}

/* =========================
   モーダル
========================= */

window.openRegister = function(){

    document.getElementById("registerModal")
    .style.display = "flex";

}

window.closeRegister = function(){

    document.getElementById("registerModal")
    .style.display = "none";

}

/* =========================
   新規登録
========================= */

window.signUp = async function(){

    const email =
    document.getElementById(
        "registerEmail"
    ).value;

    const password =
    document.getElementById(
        "registerPassword"
    ).value;

    if(!email || !password){

        alert("入力してください");
        return;

    }

    const { data, error } =
    await supabase.auth.signUp({

        email: email,
        password: password

    });

    if(error){

        alert(error.message);
        return;

    }

    const user =
    data.user;

    const { error: insertError } =
    await supabase
    .from('users')
    .insert([{

        id: user.id,
        password: password

    }]);

    if(insertError){

        console.error(insertError);

        alert(
          "users保存失敗"
        );

        return;
        
    }
    
    alert("登録成功");

    closeRegister();

}

/* =========================
   ログイン
========================= */

window.login = async function(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    if(!email || !password){

        showMessage(
            "入力してください"
        );

        return;

    }

    const { data, error } =
    await supabase.auth
    .signInWithPassword({

        email: email,
        password: password

    });

    if(error){

        showMessage(
            "メールまたはパスワードが違います"
        );

        return;

    }

    showMessage("入室しました");

    /* =========================
       users確認
    ========================= */

    const {
        data: profile,
        error: profileError
    } =
    await supabase
    .from('users')
    .select('*')
    .eq('id', data.user.id)
    .single();

    console.log(profile);
    console.log(profileError);

    setTimeout(()=>{

        if(

            !profile.name ||

            !profile.interests ||

            profile.interests.length === 0

        ){

            location.href =
            "setup.html";

        }else{

            location.href =
            "chat.html";

        }

    },1000);

}

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#35104d 0%,#0b0b14 40%,#050507 100%);
    overflow:hidden;
    font-family:sans-serif;
    color:white;
}

/* 背景のぼかし光 */

.glow{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:#8b5cf6;
    filter:blur(150px);
    opacity:0.25;
    animation:float 6s ease-in-out infinite;
}

.glow2{
    top:60%;
    left:60%;
    background:#ec4899;
    animation-delay:2s;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-20px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* ログインカード */

.login-box{
    position:relative;
    width:350px;
    padding:40px;
    border-radius:24px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 30px rgba(139,92,246,0.25);

    z-index:2;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    font-size:32px;
    margin-bottom:8px;
    letter-spacing:2px;
}

.title p{
    color:#cfcfe8;
    font-size:14px;
}

/* 入力 */

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);
    color:white;

    font-size:15px;
}

.input-group input::placeholder{
    color:#b8b8d0;
}

/* ボタン */

.login-btn{
    width:100%;
    padding:14px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.25s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 0 20px rgba(236,72,153,0.5);
}

/* 下テキスト */

.bottom-text{
    margin-top:18px;
    text-align:center;
    font-size:13px;
    color:#bcbcd4;
}

.bottom-text a{
    color:#d8b4fe;
    text-decoration:none;
}

.secret{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color:#888;
    letter-spacing:2px;
}

</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<div class="login-box">

    <div class="title">
        <h1>LOGIN</h1>
        <p>ようこそ。</p>
    </div>

    <div class="input-group">
        <input type="email" placeholder="メールアドレス">
    </div>

    <div class="input-group">
        <input type="password" placeholder="パスワード">
    </div>

    <button class="login-btn">
        入室する
    </button>

    <div class="bottom-text">
        初めてですか？ <a href="#">新規登録</a>
    </div>

    <div class="secret">
        only for you
    </div>

</div>

</body>
</html>
```

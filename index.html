<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    font-family:sans-serif;
    color:white;

    background:
    radial-gradient(circle at top,
    #34124a 0%,
    #0d0d16 40%,
    #050507 100%);
}

/* 背景の光 */

.glow{
    position:absolute;
    width:420px;
    height:420px;

    border-radius:50%;

    background:#8b5cf6;

    filter:blur(140px);

    opacity:0.25;

    animation:float 6s ease-in-out infinite;
}

.glow2{
    left:60%;
    top:55%;

    background:#ec4899;

    animation-delay:2s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* ログインカード */

.login-box{

    position:relative;

    width:360px;

    padding:40px;

    border-radius:28px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 30px rgba(139,92,246,0.25);

    z-index:2;

}

/* タイトル */

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    font-size:34px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.title p{
    color:#cfcfe8;
    font-size:14px;
}

/* 入力欄 */

.input-group{
    margin-bottom:18px;
}

.input-group input{

    width:100%;

    padding:14px;

    border:none;
    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:15px;
}

.input-group input::placeholder{
    color:#b8b8d0;
}

/* ボタン */

.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.25s;
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(236,72,153,0.5);

}

/* 下 */

.bottom-text{

    margin-top:18px;

    text-align:center;

    font-size:13px;

    color:#bcbcd4;
}

.bottom-text span{

    color:#d8b4fe;

    cursor:pointer;
}

/* メッセージ */

.message{

    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:#f9a8d4;

    min-height:20px;
}

/* secret */

.secret{

    margin-top:22px;

    text-align:center;

    font-size:12px;

    color:#888;

    letter-spacing:2px;
}

</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<div class="login-box">

    <div class="title">
        <h1>LOGIN</h1>
        <p>ようこそ。</p>
    </div>

    <div class="input-group">
        <input
            id="email"
            type="email"
            placeholder="メールアドレス">
    </div>

    <div class="input-group">
        <input
            id="password"
            type="password"
            placeholder="パスワード">
    </div>

    <button
        class="login-btn"
        onclick="signUp()">

        登録する

    </button>

    <div class="bottom-text">

        すでに登録済み？
        <span onclick="login()">
            ログイン
        </span>

    </div>

    <div class="message" id="message"></div>

    <div class="secret">
        only for you
    </div>

</div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
"https://mkjpfiyfhjmthrrmwgyg.supabase.co/rest/v1/";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ranBmaXlmaGptdGhycm13Z3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzA2MjIsImV4cCI6MjA5NDY0NjYyMn0.1EZR4uc0q4l1oMCgqgPqg7g6k5SCFI4zdKudD0wIsyU";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* =========================
   メッセージ表示
========================= */

function showMessage(text){

    document.getElementById("message")
    .innerText = text;

}

/* =========================
   新規登録
========================= */

async function signUp(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    if(!email || !password){

        showMessage("入力してください");
        return;

    }

    const { data, error } =
    await supabase.auth.signUp({

        email: email,
        password: password

    });

    if(error){

        showMessage(error.message);
        return;

    }

    showMessage("登録成功");

    console.log(data);

}

/* =========================
   ログイン
========================= */

async function login(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const { data, error } =
    await supabase.auth.signInWithPassword({

        email: email,
        password: password

    });

    if(error){

        showMessage(error.message);
        return;

    }

    showMessage("ログイン成功");

    console.log(data);

    setTimeout(()=>{

        location.href = "setup.html";

    },1000);

}

</script>

</body>
</html>
